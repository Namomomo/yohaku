<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>yohaku｜毎日に、書き残す余白を。</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f1;color:#30302e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;letter-spacing:.04em}
button,input,textarea{font:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:22px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px}
.logo{font-size:25px;letter-spacing:.18em}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button,.btn{border:1px solid #deddd5;border-radius:999px;background:transparent;padding:10px 15px;color:inherit}
nav button.active,.dark{background:#30302e;color:white;border-color:#30302e}
section{display:none}
section.active{display:block}
.hero{padding:100px 0 90px;max-width:720px}
.eyebrow{font-size:11px;color:#929188;letter-spacing:.2em}
h1{font-size:clamp(40px,7vw,78px);font-weight:400;line-height:1.3;margin:22px 0}
h2{font-size:28px;font-weight:400}
p{line-height:2}
.muted{color:#929188;font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.panel{background:#fffefb;border:1px solid #e1e0d8;border-radius:18px;padding:25px;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.page{background:#fffefb;border:1px solid #e1e0d8;border-radius:15px;padding:18px;text-align:left;min-height:145px}
.page small{color:#929188}
input,textarea{width:100%;border:0;border-bottom:1px solid #deddd5;background:transparent;outline:0;padding:12px 0;color:inherit}
textarea{min-height:220px;resize:vertical;line-height:2;border:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.tools button{border:1px solid #deddd5;background:#f7f6f1;border-radius:12px;padding:10px}
.decor{font-size:28px;line-height:2;min-height:35px}
.postgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.post{background:#fffefb;border:1px solid #e1e0d8;border-radius:18px;overflow:hidden}
.photo{height:160px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#dce7e1,#eee7da)}
.postbody{padding:18px}
.postbody h3{font-weight:400;font-size:16px;line-height:1.8}
.follow{border:1px solid #deddd5;border-radius:999px;background:transparent;padding:7px 12px;font-size:12px}
.follow.on{background:#c4d3c9}
.footer{border-top:1px solid #deddd5;margin-top:90px;padding-top:20px;display:flex;justify-content:space-between;color:#929188;font-size:12px}
@media(max-width:700px){
.hero{padding:65px 0 55px}
.grid,.postgrid{grid-template-columns:1fr}
header{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">yohaku</div>
<nav>
<button class="active" data-tab="home">home</button>
<button data-tab="journal">journal</button>
<button data-tab="community">みんなの余白</button>
</nav>
</header>

<section id="home" class="active">
<div class="hero">
<div class="eyebrow">A LITTLE SPACE FOR EVERYDAY</div>
<h1>毎日に、<br>書き残す余白を。</h1>
<p class="muted">書く。貼る。残す。<br>なんでもない毎日を、自分だけの記録に。</p>
<div class="actions">
<button class="btn dark" data-tab="journal">余白をつくる</button>
<button class="btn" data-tab="community">みんなの記録を見る</button>
</div>
</div>
<div class="grid">
<div class="panel">
<div class="eyebrow">WRITE</div>
<h2>書く。</h2>
<p class="muted">今日の気分、思いついたこと、忘れたくない言葉。</p>
</div>
<div class="panel">
<div class="eyebrow">COLLECT</div>
<h2>貼る。</h2>
<p class="muted">写真や好きなモチーフを並べて、自分だけのページに。</p>
</div>
<div class="panel">
<div class="eyebrow">KEEP</div>
<h2>残す。</h2>
<p class="muted">なんでもない毎日が、あとから大切な記録になる。</p>
</div>
</div>
</section>

<section id="journal">
<div class="eyebrow">MY JOURNAL</div>
<h2>余白をつくる</h2>
<p class="muted">入力内容はこのブラウザに保存されます。</p>
<div class="panel">
<input id="title" placeholder="ページのタイトル">
<textarea id="note" placeholder="書いて、貼って、残していこう。"></textarea>
<div class="tools">
<button id="sparkle">✳︎ きらきら</button>
<button id="bear">● グミベア</button>
<button id="heart">♡ ハート</button>
<button id="cloud">☁︎ 雲</button>
<button id="clear">装飾を消す</button>
</div>
<div id="decor" class="decor"></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:35px">
<h2>ページ一覧</h2>
<button class="btn dark" id="new">＋ 新しいページ</button>
</div>
<div id="pages" class="grid"></div>
</section>

<section id="community">
<div class="eyebrow">COMMUNITY</div>
<h2>みんなの余白</h2>
<p class="muted">誰かの何気ない一日を、そっとのぞく。</p>
<div class="postgrid" id="posts"></div>
</section>

<footer class="footer">
<span>yohaku</span>
<span>書く。貼る。残す。</span>
</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

let pages=JSON.parse(localStorage.getItem("yohaku-pages")||"[]");
let current=-1;

const samples=[
["mugi","朝の光と、あたたかい飲みもの。","☕"],
["sora","何もない日ほど、あとで大切になる。","☁︎"],
["nono","好きな色を集めたページ。","✳︎"],
["koto","今日できた小さなことを3つ。","🌿"],
["yura","帰り道に見つけた夕焼け。","🌇"],
["umi","休日はゆっくり、余白多め。","🫧"]
];

function save(){
localStorage.setItem("yohaku-pages",JSON.stringify(pages));
}

function show(id){
$$("section").forEach(x=>x.classList.toggle("active",x.id===id));
$$("[data-tab]").forEach(x=>x.classList.toggle("active",x.dataset.tab===id));
if(id==="journal")renderPages();
if(id==="community")renderPosts();
window.scrollTo({top:0,behavior:"smooth"});
}

$$("[data-tab]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab)));

function renderPages(){
$("#pages").innerHTML=pages.length?pages.map((p,i)=>`
<button class="page" data-page="${i}">
<small>${p.date}</small>
<h3>${p.title||"無題の余白"}</h3>
<p class="muted">${(p.note||"まだ何も書かれていません").slice(0,45)}</p>
</button>`).join(""):`<div class="panel" style="grid-column:1/-1;text-align:center">
<p class="muted">まだページがありません。<br>「新しいページ」から始めよう。</p>
</div>`;
$$("[data-page]").forEach(b=>b.onclick=()=>loadPage(Number(b.dataset.page)));
}

function loadPage(i){
current=i;
$("#title").value=pages[i].title||"";
$("#note").value=pages[i].note||"";
$("#decor").textContent=pages[i].decor||"";
}

$("#new").onclick=()=>{
pages.unshift({title:"",note:"",decor:"",date:new Date().toLocaleDateString("ja-JP")});
current=0;
save();
loadPage(0);
renderPages();
};

function ensurePage(){
if(current===-1)$("#new").click();
}

$("#title").addEventListener("input",()=>{
ensurePage();
pages[current].title=$("#title").value;
save();
});

$("#note").addEventListener("input",()=>{
ensurePage();
pages[current].note=$("#note").value;
save();
});

function addDecoration(x){
ensurePage();
pages[current].decor=(pages[current].decor||"")+x;
$("#decor").textContent=pages[current].decor;
save();
}

$("#sparkle").onclick=()=>addDecoration(" ✳︎ ");
$("#bear").onclick=()=>addDecoration(" 🧸 ");
$("#heart").onclick=()=>addDecoration(" ♡ ");
$("#cloud").onclick=()=>addDecoration(" ☁︎ ");
$("#clear").onclick=()=>{
if(current!==-1){
pages[current].decor="";
$("#decor").textContent="";
save();
}
};

function renderPosts(){
$("#posts").innerHTML=samples.map((p,i)=>`
<article class="post">
<div class="photo">${p[2]}</div>
<div class="postbody">
<h3>${p[1]}</h3>
<p class="muted">@${p[0]}</p>
<button class="follow" data-follow="${i}">フォローする</button>
</div>
</article>`).join("");
$$("[data-follow]").forEach(b=>b.onclick=()=>{
b.classList.toggle("on");
b.textContent=b.classList.contains("on")?"フォロー中":"フォローする";
});
}

renderPages();
renderPosts();
</script>
</body>
</html>
